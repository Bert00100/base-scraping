[project]
name = "base-scraping"
version = "0.1.0"
description = "Captação e enriquecimento de leads B2B brasileiros, construído sobre o BaseCNPJ"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "selectolax>=0.3",
    "pydantic>=2.6",
    "typer>=0.12",
    "dnspython>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.uv]
default-groups = []

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
